<!DOCTYPE html>
<html>
<head>
    <title>Frameset Example</title>
</head>

<frameset rows="25%,75%" border="5" noresize>
    <frame name="topframe" src="top.html">
    <frameset cols="33%,33%,33%" border="5" noresize>
            <frame name="leftframe" src="left.html">
            <frame name="middleframe" src="middle.html">
            <frame name="rightframe" src="right.html">
        
</frameset>
</html>
