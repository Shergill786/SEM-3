
<!DOCTYPE html>
<html lang="en">
<head>

<style>
    *{
        margin: 0px;
        padding: 0px;
    }
.container{
    display: grid;
    width: 100vw;
    height: 100vh;
    text-align: center;
    grid-template-columns: 496px 500px 500px;
    grid-template-rows:265px 270px 250px;
    grid-column-gap: 20px;
    grid-row-gap: 20px;
}
</style>
<body>
    <div class="container">
        <div class="i1" style="background-color:rgb(122, 26, 26)">item 1</div>
        <div class="i2" style="background-color: rgb(175, 156, 119);">item 2</div>
        <div class="i3" style="background-color: blue;">item 3</div>
        <div class="i4" style="background-color: brown;">item 4</div>
        <div class="i5" style="background-color: darkmagenta;">item 5</div>
        <div class="i6" style="background-color: dimgray;">item 6</div>
        <div class="i7" style="background-color: grey;">item 7</div>
        <div class="i8" style="background-color: hotpink;">item 8</div>
        <div class="i9" style="background-color: darkgoldenrod;">item 9</div>


    </div>
</body>
</html>
