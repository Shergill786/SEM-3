<!DOCTYPE html>
<html>
<head>
    <title>Shape Change</title>
</head>

<body>

<h2>Change Shape</h2>

<div id="box"></div>

<br>

<input type="radio" name="shape" onclick="circle()">Circle

<input type="radio" name="shape" onclick="square()">Square

<input type="radio" name="shape" onclick="rectangle()">Rectangle

<input type="radio" name="shape" onclick="fillYellow()">Fill Yellow

<input type="radio" name="shape" onclick="fillNone()">Fill None


<style>
    #box {
        width: 100px;
        height: 100px;
        border: 3px solid blue;
       
    }
</style>


<script>

function circle() {
    document.getElementById("box").style.borderRadius = "50%";
}

function square() {
    document.getElementById("box").style.width = "100px";
    document.getElementById("box").style.height = "100px";
    document.getElementById("box").style.borderRadius = "0";
}

function rectangle() {
    document.getElementById("box").style.width = "180px";
    document.getElementById("box").style.height = "100px";
    document.getElementById("box").style.borderRadius = "0";
}

function fillYellow() {
    document.getElementById("box").style.backgroundColor = "yellow";
}

function fillNone() {
    document.getElementById("box").style.backgroundColor = "transparent";
}

</script>

</body>
</html>
